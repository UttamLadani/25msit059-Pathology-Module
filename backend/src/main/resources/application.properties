spring.application.name=pathology-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pathology?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:pathology}
spring.datasource.password=${DB_PASSWORD:pathology}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
