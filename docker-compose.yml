services:
  mysql:
    image: mysql:8.4
    container_name: pathology-mysql
    environment:
      MYSQL_DATABASE: pathology
      MYSQL_USER: pathology
      MYSQL_PASSWORD: pathology
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pathology_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pathology_data:
